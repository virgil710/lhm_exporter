name: Go CI/CD

on:
  push:
    # branches: [ "main" ]
    branches:
      - "**"
    tags:
      - '**'
  pull_request:
    branches:
      - "**"

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          # cache: true

      - name: Run tests
        run: go test ./... -v

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        # cache: true

    - name: Build
      run: make build VERSION=${GITHUB_REF_NAME}

    - name: Upload Linux Binary
      uses: actions/upload-artifact@v4
      with:
        name: lhm_exporter_linux_amd64
        path: lhm_exporter_linux_amd64_*

    - name: Upload Linux Binary
      uses: actions/upload-artifact@v4
      with:
        name: lhm_exporter_linux_arm64
        path: lhm_exporter_linux_arm64_*

    - name: Upload Windows Binary
      uses: actions/upload-artifact@v4
      with:
        name: lhm_exporter_windows
        path: lhm_exporter_windows_*.exe

