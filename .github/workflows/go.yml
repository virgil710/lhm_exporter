name: Go CI/CD

on:
  push:
    branches: [ "main" ]
    tags:
      - '**'
  pull_request:
    branches: [ "main" ]

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Lint
        run: go vet ./...

  test:
    strategy:
      matrix:
        go-version:
          - '1.23'
          - '1.24'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Run tests
        run: go test -v -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        if: matrix.go-version == '1.24'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  compat-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go (minimum supported)
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Go version matches go.mod
        run: |
          GO_VERSION=$(go version | grep -oP 'go\K[0-9]+\.[0-9]+')
          MOD_VERSION=$(grep -oP '^go \K[0-9]+\.[0-9]+' go.mod)
          echo "Running Go $GO_VERSION, go.mod requires Go $MOD_VERSION"
          if [ "$GO_VERSION" != "$MOD_VERSION" ]; then
            echo "::warning::Go version mismatch: running $GO_VERSION, go.mod specifies $MOD_VERSION"
          fi

      - name: Run compatibility tests
        run: go test -v -run "Compat|Compat|MinGo|Slog|Atomic|MaxInt|CutPrefix|HardwareCatalogAll|SensorValueParsingAll|MetricNaming|PrometheusMetricGathering|JSONUnmarshalEdge" -count=1 ./...

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, compat-test]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Build
      run: make build VERSION=${GITHUB_REF_NAME}

    - name: Upload Linux AMD64 Binary
      uses: actions/upload-artifact@v4
      with:
        name: lhm_exporter_linux_amd64
        path: lhm_exporter_linux_amd64_*

    - name: Upload Linux ARM64 Binary
      uses: actions/upload-artifact@v4
      with:
        name: lhm_exporter_linux_arm64
        path: lhm_exporter_linux_arm64_*

    - name: Upload Windows Binary
      uses: actions/upload-artifact@v4
      with:
        name: lhm_exporter_windows
        path: lhm_exporter_windows_*.exe

    - name: Upload MacOS AMD64 Binary
      uses: actions/upload-artifact@v4
      with:
        name: lhm_exporter_darwin_amd64
        path: lhm_exporter_darwin_amd64_*

    - name: Upload MacOS ARM64 Binary
      uses: actions/upload-artifact@v4
      with:
        name: lhm_exporter_darwin_arm64
        path: lhm_exporter_darwin_arm64_*

