run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - durationcheck
    - errname
    - errorlint
    - exportloopref
    - forcetypeassert
    - gosec
    - misspell
    - nilerr
    - prealloc
    - unconvert
    - unparam
    - whitespace

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  gosec:
    excludes:
      - G104  # Errors unhandled - covered by errcheck
      - G304  # File path provided as taint input - false positives for CLI tools
  govet:
    enable-all: true
    disable:
      - fieldalignment
  misspell:
    locale: US
  staticcheck:
    checks: ["all"]

issues:
  exclude-use-default: false
  max-issues-per-linter: 50
  max-same-issues: 10
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - unparam
    - path: cmd/
      linters:
        - unparam

severity:
  default-severity: warning
  rules:
    - linters:
        - errcheck
        - gosec
        - errorlint
      severity: error
